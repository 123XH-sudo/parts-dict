<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ heading }} · 料盒字典</title>
  <style>
    body { font-family: sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; color: #111; }
    label { display: block; margin: 12px 0 4px; }
    input[type="text"], input[type="number"] { width: 100%; box-sizing: border-box; padding: 8px; font-size: 16px; }
    .boxes { display: flex; flex-wrap: wrap; gap: 8px; }
    .error { color: #a40000; }
    button { margin-top: 16px; padding: 8px 16px; font-size: 16px; }
  </style>
</head>
<body>
  <p><a href="/">返回查找</a></p>
  <h1>{{ heading }}</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ form_action }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="name">详细名称</label>
    <input id="name" name="name" value="{{ form.name }}" required>
    <label for="aliases">通用简称（逗号分隔）</label>
    <input id="aliases" name="aliases" value="{{ form.aliases }}" required>
    <label>盒号</label>
    <div class="boxes">
      {% for n in boxes %}
      <label><input type="radio" name="box" value="{{ n }}" {% if form.box|string == n|string %}checked{% endif %}> {{ n }}</label>
      {% endfor %}
    </div>
    <label for="slot">格号</label>
    <input id="slot" name="slot" type="number" min="1" value="{{ form.slot }}" required>
    <label>数量</label>
    <label><input type="radio" name="qty_kind" value="empty" {% if form.qty_kind == "empty" %}checked{% endif %}> 没有</label>
    <label><input type="radio" name="qty_kind" value="few" {% if form.qty_kind == "few" %}checked{% endif %}> 少量</label>
    <label><input type="radio" name="qty_kind" value="many" {% if form.qty_kind == "many" %}checked{% endif %}> 大量</label>
    <label><input type="radio" name="qty_kind" value="exact" {% if form.qty_kind == "exact" %}checked{% endif %}> 具体数字</label>
    <input name="qty_count" type="number" min="0" value="{{ form.qty_count }}" placeholder="选具体数字时填写">
    <label><input type="checkbox" name="polarized" {% if form.polarized %}checked{% endif %}> 有极性（贴反会坏）</label>
    <label for="note">备注</label>
    <input id="note" name="note" value="{{ form.note }}">
    <button type="submit">保存</button>
  </form>
  {% if show_deactivate %}
  <form method="post" action="/parts/{{ part_id }}/deactivate">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <button type="submit">停用这条料</button>
  </form>
  {% endif %}
</body>
</html>
