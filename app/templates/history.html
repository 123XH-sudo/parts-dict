<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>修改记录 · 料盒字典</title>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 24px auto; padding: 0 16px; color: #111; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    h1 { font-size: 22px; margin: 0; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    td, th { text-align: left; padding: 8px 4px; border-bottom: 1px solid #ddd; vertical-align: top; }
    .empty { margin: 16px 0; color: #555; }
  </style>
</head>
<body>
  <header>
    <h1>修改记录</h1>
    <p>{{ display_name or username }} · <a href="/">查找</a> · <a href="/logout">退出</a></p>
  </header>
  {% if rows %}
  <table>
    <thead>
      <tr><th>时间</th><th>人</th><th>动作</th><th>对象</th><th>摘要</th></tr>
    </thead>
    <tbody>
      {% for row in rows %}
      <tr>
        <td>{{ row.at }}</td>
        <td>{{ row.who }}</td>
        <td>{{ row.action }}</td>
        <td>{{ row.target }}</td>
        <td>{{ row.summary }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  {% else %}
  <p class="empty">还没有修改记录。</p>
  {% endif %}
</body>
</html>
