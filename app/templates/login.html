<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · 料盒字典</title>
  <style>
    body { font-family: sans-serif; max-width: 360px; margin: 48px auto; color: #111; }
    h1 { font-size: 22px; }
    label { display: block; margin: 12px 0 4px; }
    input { width: 100%; box-sizing: border-box; padding: 8px; font-size: 16px; }
    button { margin-top: 16px; padding: 8px 16px; font-size: 16px; }
    .error { color: #a40000; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>料盒字典</h1>
  <p>登录后才能查料和改库存。</p>
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="username">用户名</label>
    <input id="username" name="username" autocomplete="username" required>
    <label for="password">密码</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">登录</button>
  </form>
  {% if error %}
  <p class="error">{{ error }}</p>
  {% endif %}
</body>
</html>
