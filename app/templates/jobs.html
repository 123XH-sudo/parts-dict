<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>本板贴片 · 料盒字典</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 24px auto; padding: 0 16px; color: #111; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    h1, h2 { font-size: 22px; margin: 0; }
    h2 { font-size: 18px; margin: 24px 0 8px; }
    label { display: block; margin: 12px 0 4px; }
    input[type="text"] { width: 100%; box-sizing: border-box; padding: 8px; font-size: 16px; }
    .error { color: #a40000; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    td, th { text-align: left; padding: 8px 4px; border-bottom: 1px solid #ddd; }
    button { margin-top: 12px; padding: 8px 16px; font-size: 16px; }
  </style>
</head>
<body>
  <header>
    <h1>本板贴片</h1>
    <p>{{ display_name or username }} · <a href="/">查找</a> · <a href="/history">修改记录</a>{% if is_admin %} · <a href="/users">账号</a>{% endif %} · <a href="/logout">退出</a></p>
  </header>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <h2>上传嘉立创 BOM</h2>
  <form method="post" action="/jobs" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="title">短名称</label>
    <input id="title" name="title" placeholder="无刷驱动 PCB1">
    <label for="file">xlsx 或 csv</label>
    <input id="file" name="file" type="file" accept=".xlsx,.csv" required>
    <button type="submit">生成清单</button>
  </form>
  {% if jobs %}
  <h2>已上传的板</h2>
  <table>
    <thead><tr><th>名称</th><th>文件</th></tr></thead>
    <tbody>
      {% for job in jobs %}
      <tr>
        <td><a href="/jobs/{{ job.id }}">{{ job.title }}</a></td>
        <td>{{ job.source_filename }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  {% endif %}
</body>
</html>
